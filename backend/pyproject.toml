[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printhub"
dynamic = ["version"]
description = "Fruitstand office print hub (local service)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pillow>=10.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
printhub = "printhub.cli:main"

[tool.setuptools.dynamic]
version = { attr = "printhub.__version__" }

[tool.setuptools.packages.find]
include = ["printhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
